# Crucible — one-command local deployment.
#
#   docker compose up --build          # backend + frontend
#   docker compose --profile docs up --build docs   # + documentation site
#
# Running the test suites (see docs/development.md):
#
#   docker compose run --rm backend-tests
#   docker compose run --rm frontend-tests
#
# Backend:  http://localhost:8000  (interactive API docs at /docs)
# Frontend: http://localhost:8080
# Docs:     http://localhost:8001  (only with --profile docs)

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    ports:
      - "8000:8000"
    volumes:
      - crucible-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/workflows', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./crucible_gui
      dockerfile: Dockerfile
      target: serve
      args:
        VITE_API_BASE_URL: /api/v1
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  docs:
    build:
      context: .
      dockerfile: docs/Dockerfile
    ports:
      - "8001:8001"
    profiles: ["docs"]

  backend-tests:
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    profiles: ["test"]

  frontend-tests:
    build:
      context: ./crucible_gui
      dockerfile: Dockerfile
      target: test
    profiles: ["test"]

volumes:
  crucible-data:
