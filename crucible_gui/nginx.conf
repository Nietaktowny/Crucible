server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy API calls to the backend service so the built frontend
    # can call a same-origin "/api/v1/..." path (see VITE_API_BASE_URL in
    # the frontend's Dockerfile) instead of a hardcoded host/port — this is
    # what makes the same image work whether it's opened from the machine
    # running Docker or from another machine on the network.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Single-page app: let React Router handle unknown paths client-side.
    location / {
        try_files $uri /index.html;
    }
}
